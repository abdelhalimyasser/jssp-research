[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "jssp-research"
version = "0.1.0"
description = "Reproducible research framework for deterministic classical job-shop scheduling."
readme = "README.md"
# license = "MIT"
# license-files = ["LICEN[CS]E*"]
requires-python = ">=3.15,<3.16"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "scipy>=1.18.1",
]

[project.scripts]
jssp = "jssp_research.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17,<7.0",
    "maturin>=1.16,<2.0",
    "pytest>=9.2,<10.0",
    "pytest-cov>=7.1,<8.0",
    "ruff>=0.17.6,<0.18",
]

[tool.uv]
required-version = ">=0.13.9,<0.14"
python-preference = "managed"
default-groups = ["dev"]

[tool.maturin]
manifest-path = "crates/jssp-python/Cargo.toml"
python-source = "src"
module-name = "jssp_research._native"
bindings = "pyo3"

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["jssp_research"]

[tool.coverage.report]
show_missing = true
skip_covered = true