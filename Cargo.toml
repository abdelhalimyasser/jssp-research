[workspace]
resolver = "3"
members = [
    "crates/jssp-core",
    "crates/jssp-python",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"

[workspace.dependencies]
jssp-core = { path = "crates/jssp-core", version = "0.1.0" }
pyo3 = { version = "0.30.1", features = ["extension-module"] }
rand_chacha = "=0.10.0"
sha2 = "=0.11.1"
